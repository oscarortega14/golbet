# PostgreSQL. Versions 9.3 and up are supported.
#
# En desarrollo/test se usa el contenedor Docker (docker-compose.yml) en 127.0.0.1:5441.
# En producción se conecta al servidor definido por las variables DB_* (ver config/deploy.yml).
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5441) %>
  username: <%= ENV.fetch("DB_USERNAME", "golbet") %>
  password: <%= ENV.fetch("DB_PASSWORD", "golbet") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "golbet_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "golbet_test") %>

# Producción usa bases separadas para la app y para los solid_* (cache/queue/cable).
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "golbet_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CACHE", "golbet_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_QUEUE", "golbet_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CABLE", "golbet_production_cable") %>
    migrations_paths: db/cable_migrate
